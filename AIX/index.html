<!DOCTYPE html>
<html>
<head>
    <style>
        body, html, #map { height: 100%; margin: 0; padding: 0; background: #0b0b0d; }
        .fr-marker { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .fr-plane { width: 22px; height: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .fr-tag {
            background: #fdf001; border: 1px solid #c0b400; color: #000;
            padding: 3px 6px; border-radius: 4px; font-family: monospace;
            font-size: 10px; line-height: 1.2; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            white-space: nowrap; font-weight: bold;
        }
        .fr-tag b { display: block; font-size: 11px; }
        .fr-tag img { height: 10px; vertical-align: middle; margin-right: 4px; }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <div id="map"></div>
    <script>
        const COK = { lat: 10.152, lng: 76.392 };
        const AIRPORTS = { 'DXB':{lat:25.2,lng:55.3}, 'SHJ':{lat:25.3,lng:55.5}, 'DOH':{lat:25.2,lng:51.6}, 'MCT':{lat:23.5,lng:58.2} };
        let map, markers = new Map();

        function CustomMarker(pos, html, map) { this.pos = pos; this.html = html; this.setMap(map); }
        CustomMarker.prototype = Object.create(google.maps.OverlayView.prototype);
        CustomMarker.prototype.onAdd = function() {
            this.div = document.createElement('div'); this.div.className = 'fr-marker';
            this.div.innerHTML = this.html; this.getPanes().overlayMouseTarget.appendChild(this.div);
        };
        CustomMarker.prototype.draw = function() {
            const p = this.getProjection().fromLatLngToDivPixel(this.pos);
            if(p && this.div) { this.div.style.left = p.x+'px'; this.div.style.top = p.y+'px'; }
        };
        CustomMarker.prototype.onRemove = function() { if(this.div) this.div.remove(); };

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: COK, zoom: 6, disableDefaultUI: true,
                styles: [{ "featureType": "all", "stylers": [{ "invert_lightness": true }, { "saturation": -100 }] }]
            });
            fetchData();
            setInterval(fetchData, 30000);
        }

        async function fetchData() {
            const url = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.flightradar24.com/common/v1/airport.json?code=cok&plugin-setting[schedule][mode]=arrivals&limit=50')}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const flights = data.result.response.airport.pluginData.schedule.arrivals.data;
                updateRadar(flights);
            } catch(e) {}
        }

        function updateRadar(flights) {
            const now = Math.floor(Date.now()/1000);
            const seen = new Set();
            flights.forEach(f => {
                const fl = f.flight; const fn = fl.identification.number.default;
                const est = fl.time.estimated.arrival || fl.time.scheduled.arrival;
                if(est > now && est < now + 14400) {
                    seen.add(fn);
                    const origin = fl.airport.origin.code.iata;
                    const start = AIRPORTS[origin] || {lat: 20, lng: 70};
                    const progress = Math.max(0, Math.min(1, (now - (est - 10800)) / 10800));
                    const pos = new google.maps.LatLng(start.lat + (COK.lat-start.lat)*progress, start.lng + (COK.lng-start.lng)*progress);
                    const logo = `https://logo.clearbit.com/${fn.startsWith('IX')?'airindiaexpress.com':'airasia.com'}`;
                    const html = `<div class="fr-plane"><svg viewBox="0 0 24 24" fill="#ff8a1e"><path d="M21,16v-2l-8-5V3.5c0-0.8-0.7-1.5-1.5-1.5S10,2.7,10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/></svg></div>
                                  <div class="fr-tag"><b><img src="${logo}">${fn}</b><span>${fl.aircraft.registration}</span><br><span>${origin}-COK</span></div>`;
                    if(markers.has(fn)) { markers.get(fn).pos = pos; markers.get(fn).div.innerHTML = html; markers.get(fn).draw(); }
                    else markers.set(fn, new CustomMarker(pos, html, map));
                }
            });
            markers.forEach((m, k) => { if(!seen.has(k)) { m.setMap(null); markers.delete(k); }});
        }

        const s = document.createElement('script');
        s.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initMap`;
        document.head.appendChild(s);
    </script>
</body>
</html>
