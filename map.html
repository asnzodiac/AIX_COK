<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0B0B0D"/>
  <title>AIX SEC OPS – Live Map · COK</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #16151b;
      --card: #131218;
      --border: #27252e;
      --text: #f3f1ec;
      --muted: #8b8892;
      --accent: #e2394a;
      --accent2: #ff8a1e;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100%; background: var(--bg); }
    body { font-family: var(--sans); color: var(--text); }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-mark {
      width: 18px; height: 18px;
      background: linear-gradient(135deg, var(--accent) 52%, var(--accent2) 52%);
      clip-path: polygon(0 100%, 100% 100%, 100% 20%, 40% 0, 0 30%);
      border-radius: 2px;
    }
    .brand-title { font-family: var(--mono); font-weight: 700; font-size: .82rem; }
    .brand-sub { font-family: var(--mono); font-size: .6rem; color: var(--muted); }
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: .72rem; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent2); }
    .pill {
      font-family: var(--mono); font-size: .65rem; color: var(--muted);
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }
    .dot.ok { background: #35c48a; box-shadow: 0 0 6px #35c48a; }
    .dot.warn { background: #ffb238; }
    .dot.bad { background: #ff5a5a; }

    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }

    .fr-marker {
      display: flex; align-items: center; gap: 6px;
      transform: translate(-50%, -50%);
    }
    .fr-plane {
      width: 28px; height: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      transition: transform .4s linear;
    }
    .fr-tag {
      background: #fdf001; border: 1px solid #c0b400; color: #000;
      padding: 4px 7px; border-radius: 5px; font-family: monospace;
      font-size: 10px; line-height: 1.25; box-shadow: 0 4px 10px rgba(0,0,0,0.45);
      white-space: nowrap; font-weight: 700;
    }
    .fr-tag b { display: block; font-size: 11px; }
    .fr-tag span { font-weight: 500; opacity: .85; }

    .leaflet-control-attribution { font-size: 9px !important; background: rgba(11,11,13,.7) !important; color: #8b8892 !important; }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <div class="brand-title">AIX SEC OPS · MAP</div>
        <div class="brand-sub">COCHIN · COK</div>
      </div>
    </div>
    <div class="actions">
      <span class="pill"><span class="dot" id="sDot"></span><span id="sTxt">Idle</span></span>
      <a class="btn" href="./AIXindex.html">← Board</a>
      <button class="btn" id="refreshBtn">↻</button>
    </div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const COK = { lat: 10.152, lng: 76.392 };

    // Last-resort fallback ONLY — used if a flight's origin coordinates
    // can't be read from FR24's schedule response at all. Expanded with
    // common Indian domestic origins (IX runs some of these) plus the
    // usual Gulf/Indian Ocean routes, but this is a safety net, not the
    // primary source anymore — see originCoords() below.
    const AIRPORTS = {
      'DXB': {lat:25.253, lng:55.365}, 'SHJ': {lat:25.328, lng:55.517},
      'DOH': {lat:25.273, lng:51.608}, 'MCT': {lat:23.593, lng:58.284},
      'AUH': {lat:24.433, lng:54.651}, 'BAH': {lat:26.271, lng:50.634},
      'KWI': {lat:29.227, lng:47.969}, 'RUH': {lat:24.958, lng:46.699},
      'JED': {lat:21.680, lng:39.157}, 'CMB': {lat:7.181, lng:79.884},
      'MLE': {lat:4.192, lng:73.529}, 'SIN': {lat:1.350, lng:103.994},
      'KUL': {lat:2.745, lng:101.710}, 'BKK': {lat:13.690, lng:100.750},
      'DEL': {lat:28.556, lng:77.100}, 'BOM': {lat:19.089, lng:72.868},
      'BLR': {lat:13.199, lng:77.710}, 'MAA': {lat:12.994, lng:80.171},
      'HYD': {lat:17.231, lng:78.430}, 'CCU': {lat:22.655, lng:88.446},
      'GOI': {lat:15.381, lng:73.831}, 'TRV': {lat:8.482, lng:76.920},
      'CNN': {lat:11.918, lng:75.547}, 'CJB': {lat:11.030, lng:77.043},
      'IXE': {lat:12.961, lng:74.890}, 'IXM': {lat:9.835, lng:78.093},
      'SLL': {lat:17.039, lng:54.091}, 'SAW': {lat:40.899, lng:29.309},
      'IST': {lat:41.275, lng:28.752}, 'AMS': {lat:52.309, lng:4.764},
      'LHR': {lat:51.470, lng:-0.454}, 'FRA': {lat:50.037, lng:8.562},
      // Indian domestic (IX runs a handful of these)
      'PNQ': {lat:18.582, lng:73.920}, 'AMD': {lat:23.077, lng:72.635},
      'IXC': {lat:30.673, lng:76.788}, 'NAG': {lat:21.092, lng:79.047},
      'IDR': {lat:22.722, lng:75.801}, 'JAI': {lat:26.824, lng:75.812},
      'LKO': {lat:26.761, lng:80.889}, 'PAT': {lat:25.591, lng:85.088},
      'VNS': {lat:25.452, lng:82.859}, 'RPR': {lat:21.180, lng:81.739},
      'BBI': {lat:20.244, lng:85.818}, 'VTZ': {lat:17.721, lng:83.225},
      'TRZ': {lat:10.765, lng:78.710}, 'TIR': {lat:13.633, lng:79.543},
      'STV': {lat:21.114, lng:72.742}, 'RAJ': {lat:22.309, lng:70.780},
      'UDR': {lat:24.618, lng:73.896}, 'ATQ': {lat:31.710, lng:74.797},
      'GAU': {lat:26.106, lng:91.586}, 'IXR': {lat:23.318, lng:85.322},
    };

    const ALLOWED = ['IX','AK','FD','UL','J9','FZ','WY','G9','3L','EY'];

    const PROXIES = [
      u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
      u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
      u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    ];

    let map, markers = new Map();
    let consecutiveFailures = 0;

    function setStatus(kind, txt) {
      const d = document.getElementById('sDot');
      d.className = 'dot' + (kind ? ' ' + kind : '');
      document.getElementById('sTxt').textContent = txt;
    }

    // Generic proxy-fallback JSON fetch, shared by the schedule call and the
    // per-flight live lookups (both live on FR24's CORS-blocked domains).
    async function fetchJson(url, silent = false) {
      const chain = [
        {url},
        ...PROXIES.map(p => ({url: p(url)}))
      ];
      for (const attempt of chain) {
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 12000);
          const res = await fetch(attempt.url, {signal: ctrl.signal, cache: 'no-store'});
          clearTimeout(tid);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          const i = text.indexOf('{'), j = text.lastIndexOf('}');
          const json = JSON.parse(i >= 0 && j > i ? text.slice(i, j + 1) : text);
          if (!silent) {
            consecutiveFailures = 0;
          }
          return json;
        } catch (e) { /* next */ }
      }
      if (!silent) consecutiveFailures++;
      throw new Error('All fetch attempts failed');
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // FR24's own live flight-detail endpoint, keyed by the flight's own
    // internal FR24 id (already present in the schedule payload).
    async function fetchLiveByFlightId(fid) {
      if (!fid) return null;
      const url = `https://data-live.flightradar24.com/clickhandler/?flight=${encodeURIComponent(fid)}&version=1.5`;
      try {
        const d = await fetchJson(url, true);
        const trail = Array.isArray(d?.trail) ? d.trail : [];
        if (!trail.length) return null;
        let best = trail[0];
        for (const t of trail) { if ((t.ts || 0) > (best.ts || 0)) best = t; }
        const lat = best.lat, lon = best.lng, hd = best.hd;
        if (typeof lat !== 'number' || typeof lon !== 'number') return null;
        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
        if (haversineKm(lat, lon, COK.lat, COK.lng) > 7000) return null;
        return { lat, lon, track: typeof hd === 'number' ? hd : null };
      } catch (e) {
        return null;
      }
    }

    // ------------------------------------------------------------
    // Real fix: get the origin airport's coordinates straight from
    // FR24's schedule payload (fl.airport.origin.position), which is
    // the same data FR24 itself uses — instead of relying on a
    // hand-typed lookup table that will always be missing something.
    // Only fall back to the local table if FR24 didn't send position
    // data for that airport, and only draw a marker at all if we have
    // *some* real coordinate for the origin — never a guessed one.
    // ------------------------------------------------------------
    function originCoords(fl, iata) {
      const p = fl.airport?.origin?.position;
      if (p && typeof p.latitude === 'number' && typeof p.longitude === 'number') {
        return { lat: p.latitude, lng: p.longitude };
      }
      if (iata && AIRPORTS[iata]) return AIRPORTS[iata];
      return null; // unknown — caller must skip rather than guess
    }

    function bearingDeg(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
      const φ1 = toRad(lat1), φ2 = toRad(lat2), Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    // The bundled glyph's nose points to the upper-right (~NE) at rest, not
    // true north. If live headings still look consistently off by a fixed
    // amount, nudge this in 90° steps (0 / 90 / 180 / -90) to match.
    const ICON_HEADING_OFFSET = -45;

    function initMap() {
      map = L.map('map', {
        center: [COK.lat, COK.lng],
        zoom: 6,
        zoomControl: true,
        attributionControl: true
      });

      L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_3inz_1_e5e2d0c2172ba5e930088c4a', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      L.circleMarker([COK.lat, COK.lng], {
        radius: 8, color: '#e2394a', fillColor: '#ff8a1e', fillOpacity: 0.9, weight: 2
      }).addTo(map).bindPopup('<b>COK</b><br>Cochin International');

      fetchData();
      setInterval(fetchData, 30000);
    }

    async function fetchData() {
      setStatus('warn', 'Loading…');
      const url = 'https://api.flightradar24.com/common/v1/airport.json?code=cok&plugin-setting[schedule][mode]=arrivals&limit=80';
      let scheduleData;
      try {
        scheduleData = await fetchJson(url);
      } catch (e) {
        setStatus('bad', 'No data');
        return; // keep last markers rather than clearing the board
      }
      const flights = scheduleData?.result?.response?.airport?.pluginData?.schedule?.arrivals?.data || [];

      const now = Math.floor(Date.now() / 1000);
      const candidates = []; // [flightNumber, fr24Id]
      flights.forEach(f => {
        const fl = f.flight;
        const fn = fl?.identification?.number?.default || '';
        if (!fn) return;
        if (!ALLOWED.includes(fn.slice(0, 2))) return;
        const est = fl.time?.estimated?.arrival || fl.time?.scheduled?.arrival || 0;
        if (est < now - 1800 || est > now + 14400) return;
        const fid = fl.identification?.id;
        if (fid) candidates.push([fn, fid]);
      });

      const live = new Map();
      await Promise.all(candidates.map(async ([fn, fid]) => {
        const pos = await fetchLiveByFlightId(fid);
        if (pos) live.set(fn, pos);
      }));

      let liveCount = 0;
      live.forEach(() => liveCount++);
      setStatus('ok', `Live ${liveCount}/${candidates.length} · ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`);

      updateRadar(flights, live);
    }

    function updateRadar(flights, live) {
      const now = Math.floor(Date.now() / 1000);
      const seen = new Set();

      flights.forEach(f => {
        const fl = f.flight;
        if (!fl) return;
        const fn = fl.identification?.number?.default || '';
        if (!fn) return;
        const code = fn.slice(0, 2);
        if (!ALLOWED.includes(code)) return;

        const est = fl.time?.estimated?.arrival || fl.time?.scheduled?.arrival || 0;
        if (est < now - 1800 || est > now + 14400) return;

        const origin = fl.airport?.origin?.code?.iata || '???';
        const reg = fl.aircraft?.registration || '–';

        const liveHit = live && live.get(fn);
        let lat, lng, track, isLive;

        if (liveHit) {
          lat = liveHit.lat;
          lng = liveHit.lon;
          track = liveHit.track != null ? liveHit.track : bearingDeg(liveHit.lat, liveHit.lon, COK.lat, COK.lng);
          isLive = true;
        } else {
          const start = originCoords(fl, origin);
          if (!start) {
            // No live position AND no known coordinate for the origin —
            // do not guess. Drop any stale marker and skip this flight
            // until we have something real to show.
            if (markers.has(fn)) { map.removeLayer(markers.get(fn)); markers.delete(fn); }
            return;
          }
          const windowSec = 10800;
          const progress = Math.max(0, Math.min(1, (now - (est - windowSec)) / windowSec));
          lat = start.lat + (COK.lat - start.lat) * progress;
          lng = start.lng + (COK.lng - start.lng) * progress;
          track = bearingDeg(start.lat, start.lng, COK.lat, COK.lng);
          isLive = false;
        }

        seen.add(fn);
        const remaining = est - now;
        const color = !isLive
          ? '#8b8892'
          : (remaining < 900 ? '#ff5a5a' : (remaining < 2700 ? '#ffb238' : '#ff8a1e'));
        const rot = ((track || 0) + ICON_HEADING_OFFSET + 360) % 360;

        const html = `
          <div class="fr-marker">
            <div class="fr-plane" style="transform:rotate(${rot}deg)"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="${color}" d="M21,16v-2l-8-5V3.5c0-0.8-0.7-1.5-1.5-1.5S10,2.7,10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/></svg></div>
            <div class="fr-tag"><b>${fn}</b><span>${reg}</span><br><span>${origin}→COK${isLive ? '' : ' · est.'}</span></div>
          </div>`;

        if (markers.has(fn)) {
          const m = markers.get(fn);
          m.setLatLng([lat, lng]);
          m.setIcon(L.divIcon({
            className: 'fr-marker',
            html: html,
            iconSize: [120, 40],
            iconAnchor: [14, 14]
          }));
        } else {
          const m = L.marker([lat, lng], {
            icon: L.divIcon({
              className: 'fr-marker',
              html: html,
              iconSize: [120, 40],
              iconAnchor: [14, 14]
            }),
            zIndexOffset: 100
          }).addTo(map);
          m.bindPopup(`<b>${fn}</b><br>${reg}<br>${origin} → COK<br>${isLive ? 'Live FR24 position' : 'Estimated position'}<br>ETA ~ ${new Date(est*1000).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit'})}`);
          markers.set(fn, m);
        }
      });

      markers.forEach((m, k) => {
        if (!seen.has(k)) {
          map.removeLayer(m);
          markers.delete(k);
        }
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
      fetchData();
    });

    initMap();
  </script>
</body>
</html>
