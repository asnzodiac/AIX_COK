<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AIX SEC OPS – COK RADAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<script src="./config.js"></script>

<style>
/* AIX DESIGN SYSTEM (Maintained from your working file) */
:root {
  --bg: #0b0b0d; --surface: #16151b; --card: #131218; --border: #27252e;
  --text: #f3f1ec; --muted: #8b8892; --accent: #e2394a; --accent2: #ff8a1e;
  --teal: #2bb8b0; --green: #35c48a; --yellow: #ffb238; --red: #ff5a5a;
  --mono: 'JetBrains Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  --radius: 8px;
}

body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); overflow-x: hidden; }

/* TOP BAR & TABS */
.topbar { position: sticky; top: 0; z-index: 500; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 20px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; position: sticky; top: 55px; z-index: 400; }
.tab { padding: 12px 2px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; font-size: 0.8rem; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* SECTIONS */
.section { display: none; padding: 16px; }
.section.active { display: block; }

/* RADAR VIEW */
#radar-container { width: 100%; height: calc(100vh - 120px); position: relative; border-radius: var(--radius); overflow: hidden; background: #000; }
#map { width: 100%; height: 100%; }

/* FR24 CUSTOM YELLOW TAGS */
.fr-label-wrap { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: pointer; z-index: 1000; }
.fr-plane-icon { width: 24px; height: 24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); transform-origin: center; }
.fr-tag {
    background: #fdf001; /* FlightRadar24 Yellow */
    border: 1px solid #b5ab00;
    color: #000;
    padding: 3px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.2;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    white-space: nowrap;
}
.fr-tag b { display: block; font-size: 11px; font-weight: 800; }
.fr-tag .route { font-weight: 600; opacity: 0.8; }
.fr-tag .reg { opacity: 0.7; font-size: 9px; }
.fr-tag img { height: 10px; vertical-align: middle; margin-right: 4px; border-radius: 1px; }

/* TABLES */
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
th { background: var(--surface); color: var(--muted); padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
.fn-col { font-weight: 700; color: var(--teal); }
</style>
</head>
<body>

<div class="topbar">
    <div style="font-family:var(--mono); font-weight:700;">AIX SEC OPS <span style="color:var(--accent2)">COK</span></div>
    <div id="status" style="font-size:0.7rem; color:var(--green)">● RADAR LIVE</div>
</div>

<div class="tabs">
    <button class="tab active" data-tab="flights">Arrivals & Departures</button>
    <button class="tab" data-tab="turnaround">Turnaround</button>
    <button class="tab" data-tab="radar">Radar View</button>
</div>

<div id="flights" class="section active">
    <div class="table-wrap">
        <table>
            <thead><tr><th>Flight</th><th>Reg</th><th>From</th><th>ETA</th><th>Status</th></tr></thead>
            <tbody id="bArr"></tbody>
        </table>
    </div>
</div>

<div id="turnaround" class="section">
    <div class="table-wrap">
        <table id="tTurn">
            <thead><tr><th>Pair</th><th>Reg</th><th>ETA / ETD</th><th>Status</th></tr></thead>
            <tbody id="bTurn"></tbody>
        </table>
    </div>
</div>

<div id="radar" class="section">
    <div id="radar-container">
        <div id="map"></div>
    </div>
</div>

<script>
/* ============================================================
   RADAR ENGINE & DATA HANDLER
============================================================ */
const COK_COORDS = { lat: 10.1520, lng: 76.3920 };
const AIRPORT_DB = {
    'DXB': {lat: 25.25, lng: 55.36}, 'SHJ': {lat: 25.32, lng: 55.51},
    'AUH': {lat: 24.43, lng: 54.65}, 'DOH': {lat: 25.27, lng: 51.60},
    'SIN': {lat: 1.35, lng: 103.99}, 'KUL': {lat: 2.74, lng: 101.70},
    'MCT': {lat: 23.59, lng: 58.28}, 'CMB': {lat: 7.18, lng: 79.88},
    'BLR': {lat: 13.19, lng: 77.70}, 'BOM': {lat: 19.08, lng: 72.86}
};

let map, infoWindow;
let aircraftMarkers = new Map();
const ALLOWED = ['IX','AK','FD','UL','J9','FZ','WY','G9','3L','EY'];

// CUSTOM FR24 OVERLAY CLASS
function AircraftOverlay(pos, html, map, bearing) {
    this.pos = pos;
    this.html = html;
    this.bearing = bearing;
    this.setMap(map);
}
AircraftOverlay.prototype = Object.create(google.maps.OverlayView.prototype);
AircraftOverlay.prototype.onAdd = function() {
    this.div = document.createElement('div');
    this.div.className = 'fr-label-wrap';
    this.div.innerHTML = this.html;
    this.getPanes().overlayMouseTarget.appendChild(this.div);
};
AircraftOverlay.prototype.draw = function() {
    const proj = this.getProjection();
    const pixel = proj.fromLatLngToDivPixel(this.pos);
    if (pixel && this.div) {
        this.div.style.left = pixel.x + 'px';
        this.div.style.top = pixel.y + 'px';
    }
};
AircraftOverlay.prototype.onRemove = function() { if(this.div) this.div.remove(); };
AircraftOverlay.prototype.update = function(pos, bearing) {
    this.pos = pos;
    if(this.div) {
        const icon = this.div.querySelector('.fr-plane-icon');
        if(icon) icon.style.transform = `rotate(${bearing}deg)`;
    }
    this.draw();
};

async function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: COK_COORDS, zoom: 6, disableDefaultUI: true,
        styles: [
            { "featureType": "water", "stylers": [{ "color": "#0e1724" }] },
            { "featureType": "landscape", "stylers": [{ "color": "#1c2c43" }] },
            { "elementType": "labels.text.fill", "stylers": [{ "color": "#8b8892" }] },
            { "featureType": "poi", "stylers": [{ "visibility": "off" }] }
        ]
    });
    infoWindow = new google.maps.InfoWindow();
}

function calculateBearing(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function getLogo(fn) {
    const code = fn.slice(0, 2);
    const domains = { 'IX':'airindiaexpress.com', 'FZ':'flydubai.com', 'AK':'airasia.com', 'EY':'etihad.com', 'G9':'airarabia.com' };
    return domains[code] ? `https://logo.clearbit.com/${domains[code]}` : '';
}

async function loadData() {
    const url = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.flightradar24.com/common/v1/airport.json?code=cok&plugin-setting[schedule][mode]=arrivals&limit=80')}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        const arrivals = data?.result?.response?.airport?.pluginData?.schedule?.arrivals?.data || [];
        
        updateTable(arrivals);
        if(map) updateRadar(arrivals);
    } catch(e) { console.error("Fetch failed", e); }
}

function updateTable(flights) {
    const tbody = document.getElementById('bArr');
    tbody.innerHTML = '';
    flights.forEach(f => {
        const fl = f.flight;
        const fn = fl?.identification?.number?.default;
        if(!fn || !ALLOWED.includes(fn.slice(0,2))) return;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="fn-col">${fn}</td><td>${fl.aircraft?.registration || '-'}</td><td>${fl.airport.origin?.code?.iata}</td><td>${new Date(fl.time.scheduled.arrival*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${fl.status.text}</td>`;
        tbody.appendChild(tr);
    });
}

function updateRadar(flights) {
    const now = Math.floor(Date.now() / 1000);
    const seenIds = new Set();

    flights.forEach(f => {
        const fl = f.flight;
        const fn = fl?.identification?.number?.default;
        const fid = fl.identification.id;
        if(!fn || !ALLOWED.includes(fn.slice(0,2))) return;

        const origin = fl.airport.origin?.code?.iata;
        const est = fl.time.estimated.arrival || fl.time.scheduled.arrival;
        const reg = fl.aircraft?.registration || 'N/A';
        
        // Show if arriving within next 4 hours
        if (est > now && est < now + 14400) {
            seenIds.add(fid);
            const start = AIRPORT_DB[origin] || { lat: 18, lng: 70 };
            const duration = 10800; // 3h path
            const progress = Math.max(0, Math.min(1, (now - (est - duration)) / duration));
            
            const lat = start.lat + (COK_COORDS.lat - start.lat) * progress;
            const lng = start.lng + (COK_COORDS.lng - start.lng) * progress;
            const bearing = calculateBearing(start.lat, start.lng, COK_COORDS.lat, COK_COORDS.lng);
            const pos = new google.maps.LatLng(lat, lng);

            if(aircraftMarkers.has(fid)) {
                aircraftMarkers.get(fid).update(pos, bearing);
            } else {
                const logo = getLogo(fn);
                const html = `
                    <div class="fr-plane-icon" style="transform:rotate(${bearing}deg)">
                        <svg viewBox="0 0 24 24" fill="#000"><path d="M21,16v-2l-8-5V3.5c0-0.8-0.7-1.5-1.5-1.5S10,2.7,10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/></svg>
                    </div>
                    <div class="fr-tag">
                        <b>${logo?`<img src="${logo}">`:''}${fn}</b>
                        <span class="reg">${reg}</span>
                        <span class="route">${origin} - COK</span>
                    </div>`;
                aircraftMarkers.set(fid, new AircraftOverlay(pos, html, map, bearing));
            }
        }
    });

    aircraftMarkers.forEach((m, id) => { if(!seenIds.has(id)) { m.setMap(null); aircraftMarkers.delete(id); }});
}

// TAB SWITCHING LOGIC
document.querySelectorAll('.tab').forEach(t => {
    t.onclick = async () => {
        document.querySelectorAll('.tab, .section').forEach(el => el.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.tab).classList.add('active');
        
        if (t.dataset.tab === 'radar') {
            if (!map) {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initMap`;
                document.head.appendChild(script);
            } else {
                setTimeout(() => { 
                    google.maps.event.trigger(map, 'resize'); 
                    map.setCenter(COK_COORDS);
                }, 100);
            }
        }
    };
});

window.onload = () => { loadData(); setInterval(loadData, 30000); };
</script>
</body>
</html>
