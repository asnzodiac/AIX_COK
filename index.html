<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AIX SEC OPS – COK LIVE</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg: #f3f4f6; --surface: #ffffff; --card: #ffffff; --border: #e5e7eb;
  --text: #111827; --muted: #6b7280; --accent: #e2394a; --accent2: #ff8a1e;
  --teal: #0f766e; --green: #10b981; --red: #ef4444;
  --mono: 'JetBrains Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
}

body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }

.app-container { display: flex; flex-direction: column; height: 100vh; }
.topbar { flex: 0 0 auto; background: #111827; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 100; border-bottom: 2px solid var(--accent); }
.tabs { flex: 0 0 auto; display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; }
.tab { padding: 12px 15px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; border-bottom: 3px solid transparent; font-size: 0.8rem; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.main-content { flex: 1 1 auto; position: relative; }
.section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; overflow-y: auto; }
.section.active { display: block; }

#map { width: 100%; height: 100%; background: #e5e7eb; }

/* MAP LABELS CSS */
.map-label {
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.2);
}

/* INFOWINDOW STYLING */
.iw-card { padding: 10px; min-width: 200px; color: #111; }
.iw-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
.iw-logo { height: 25px; width: auto; object-fit: contain; }
.iw-fn { font-weight: 700; font-family: var(--mono); font-size: 1.1rem; }
.iw-route { font-size: 0.9rem; font-weight: 600; color: var(--accent); margin: 5px 0; }
.iw-detail { font-size: 0.75rem; color: #555; font-family: var(--mono); }

#loader { position: fixed; inset: 0; background: #111827; color: white; z-index: 9999; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; }
</style>
</head>
<body>

<div id="loader">LOADING AIRSPACE...</div>

<div class="app-container">
    <div class="topbar">
        <div class="brand">AIX SEC OPS <span style="color:var(--accent2)">LIVE</span></div>
        <div id="status" style="font-size:0.7rem; font-family:var(--mono)">● SYSTEM ACTIVE</div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="map-section">RADAR VIEW</button>
        <button class="tab" data-tab="flights-section">ARRIVALS LIST</button>
    </div>

    <div class="main-content">
        <div id="map-section" class="section active">
            <div id="map"></div>
        </div>
        <div id="flights-section" class="section">
            <div style="padding:15px">
                <table style="width:100%; border-collapse:collapse; background:white; font-size:0.8rem">
                    <thead style="background:#f9fafb">
                        <tr><th style="padding:10px; border-bottom:1px solid #ddd">FLIGHT</th><th style="padding:10px; border-bottom:1px solid #ddd">FROM</th><th style="padding:10px; border-bottom:1px solid #ddd">ETA</th></tr>
                    </thead>
                    <tbody id="bArr"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const COK_COORDS = { lat: 10.1520, lng: 76.3920 };
let map;
let markers = {};
let infoWindow;
const ALLOWED = ['IX','AK','FD','UL','J9','FZ','WY','G9','3L','EY'];

// Coords for common COK routes
const AIRPORT_DB = {
    'DXB': { lat: 25.25, lng: 55.36 }, 'SHJ': { lat: 25.32, lng: 55.51 },
    'AUH': { lat: 24.43, lng: 54.65 }, 'DOH': { lat: 25.27, lng: 51.60 },
    'SIN': { lat: 1.35, lng: 103.99 }, 'KUL': { lat: 2.74, lng: 101.70 },
    'CMB': { lat: 7.18, lng: 79.88 }, 'MCT': { lat: 23.59, lng: 58.28 }
};

function getLogo(fn) {
    const code = fn.slice(0, 2);
    const map = {
        'IX': 'airindiaexpress.com', 'AK': 'airasia.com', 'FD': 'airasia.com',
        'UL': 'srilankan.com', 'FZ': 'flydubai.com', 'WY': 'omanair.com',
        'EY': 'etihad.com', 'G9': 'airarabia.com'
    };
    return map[code] ? `https://logo.clearbit.com/${map[code]}` : '';
}

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: COK_COORDS,
        zoom: 6,
        mapTypeId: 'roadmap',
        styles: [
            { "featureType": "landscape", "stylers": [{ "color": "#f5f5f5" }] },
            { "featureType": "water", "stylers": [{ "color": "#c9d2d9" }] }
        ],
        disableDefaultUI: true
    });

    infoWindow = new google.maps.InfoWindow();

    new google.maps.Marker({
        position: COK_COORDS,
        map: map,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: "#e2394a", fillOpacity: 1, strokeWeight: 2, strokeColor: "#fff" }
    });

    document.getElementById('loader').style.display = 'none';
    updateData();
}

async function updateData() {
    try {
        const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://api.flightradar24.com/common/v1/airport.json?code=cok&plugin-setting[schedule][mode]=arrivals&limit=100')}`;
        const res = await fetch(url);
        const wrapper = await res.json();
        const data = JSON.parse(wrapper.contents);
        const flights = data?.result?.response?.airport?.pluginData?.schedule?.arrivals?.data || [];
        
        processFlights(flights);
    } catch (e) { console.error(e); }
}

function processFlights(flights) {
    const now = Math.floor(Date.now() / 1000);
    const tbody = document.getElementById('bArr');
    tbody.innerHTML = '';

    flights.forEach(f => {
        const fl = f.flight;
        const fn = fl?.identification?.number?.default;
        if (!fn || !ALLOWED.includes(fn.slice(0, 2))) return;

        const origin = fl.airport.origin?.code?.iata || '???';
        const sch = fl.time.scheduled.arrival;
        const est = fl.time.estimated.arrival || sch;
        const reg = fl.aircraft?.registration || 'N/A';
        const status = fl.status.text;

        // Add to list
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="padding:10px; border-bottom:1px solid #eee"><b>${fn}</b></td><td>${origin}</td><td>${new Date(est*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>`;
        tbody.appendChild(tr);

        // Map Marker logic (In-air: arriving in next 5 hours)
        if (est > now && est < now + 18000) {
            updateMarker({
                id: fl.identification.id || fn,
                fn, reg, origin, est, sch, status,
                logo: getLogo(fn)
            });
        }
    });
}

function updateMarker(data) {
    const origin = AIRPORT_DB[data.origin] || { lat: 20, lng: 65 };
    const now = Math.floor(Date.now() / 1000);
    const duration = 10800; // 3h path estimation
    const progress = Math.max(0, Math.min(1, (now - (data.est - duration)) / duration));

    const pos = {
        lat: origin.lat + (COK_COORDS.lat - origin.lat) * progress,
        lng: origin.lng + (COK_COORDS.lng - origin.lng) * progress
    };

    if (markers[data.id]) {
        markers[data.id].setPosition(pos);
    } else {
        markers[data.id] = new google.maps.Marker({
            position: pos,
            map: map,
            // VISIBLE LABELS ON TOP
            label: {
                text: `${data.fn}\n${data.reg}`,
                color: "#111",
                fontSize: "10px",
                fontWeight: "bold"
            },
            icon: {
                path: "M21,16L21,14L13,9L13,3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5L10,9L2,14L2,16L10,13.5L10,19L8,20.5L8,22L11.5,21L15,22L15,20.5L13,19L13,13.5L21,16Z",
                fillColor: "#ff8a1e", fillOpacity: 1, scale: 1.2, strokeWeight: 1, strokeColor: "#000", anchor: new google.maps.Point(12, 12)
            }
        });

        // CLICK FOR DETAILS
        markers[data.id].addListener("click", () => {
            const content = `
                <div class="iw-card">
                    <div class="iw-header">
                        <img src="${data.logo}" class="iw-logo" onerror="this.style.display='none'">
                        <span class="iw-fn">${data.fn}</span>
                    </div>
                    <div class="iw-route">${data.origin} ➔ COK</div>
                    <div class="iw-detail">
                        REG: ${data.reg}<br>
                        ETA: ${new Date(data.est*1000).toLocaleTimeString()}<br>
                        STATUS: ${data.status}
                    </div>
                </div>
            `;
            infoWindow.setContent(content);
            infoWindow.open(map, markers[data.id]);
        });
    }
}

document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab, .section').forEach(el => el.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.tab).classList.add('active');
    });
});

const script = document.createElement('script');
script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initMap`;
document.head.appendChild(script);

setInterval(updateData, CONFIG.REFRESH_INTERVAL);
</script>
</body>
</html>
