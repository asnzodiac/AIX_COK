<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>AIX SEC OPS – COK</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<script src="./config.js"></script>

<style>
/* ... [KEEPING ALL YOUR EXISTING CSS] ... */
:root {
  --bg: #0b0b0d; --surface: #16151b; --card: #131218; --border: #27252e;
  --text: #f3f1ec; --muted: #8b8892; --accent: #e2394a; --accent2: #ff8a1e;
  --teal: #2bb8b0; --green: #35c48a; --yellow: #ffb238; --red: #ff5a5a;
  --grey: #3a3841; --mono: 'JetBrains Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  --radius: 8px; --shadow: 0 10px 30px rgba(0,0,0,.45);
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
}
[data-theme="light"] {
  --bg: #eef0f1; --surface: #ffffff; --card: #ffffff; --border: #dcdfe3; --text: #16151a; --muted: #67656d;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.45;}
body{min-height:100dvh; padding-bottom:env(safe-area-inset-bottom);}

/* TOPBAR & TABS (Your Original Styles) */
.topbar{position:sticky; top:0; z-index:200; background:var(--surface); border-bottom:1px solid var(--border); padding:var(--sp-3) var(--sp-4); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);}
.brand{display:flex; align-items:center; gap:var(--sp-2);}
.brand-title{font-family:var(--mono); font-weight:700; font-size:.86rem;}
.tabs{display:flex; gap:var(--sp-5); padding:0 var(--sp-4); background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto;}
.tab{flex-shrink:0; padding:11px 2px; border:none; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font-size:.78rem; font-weight:600; cursor:pointer;}
.tab.active{color:var(--text); border-bottom-color:var(--accent);}
.section{display:none; padding:var(--sp-4);}
.section.active{display:block}

/* RADAR SPECIFIC STYLES */
#mapWrap { 
  position: relative; 
  width: 100%; 
  height: 75vh; /* Height is critical for display */
  min-height: 450px; 
  border-radius: var(--radius); 
  border: 1px solid var(--border); 
  background: #000; 
  overflow: hidden; 
}
#map { width: 100%; height: 100%; }

/* FR24 YELLOW TAG STYLES */
.fr-marker { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; z-index: 100; cursor: pointer; }
.fr-plane-icon { width: 22px; height: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.fr-tag {
  background: #fdf001; /* FR24 Yellow */
  border: 1px solid #c0b400;
  color: #000;
  padding: 4px 8px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.2;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  white-space: nowrap;
}
.fr-tag b { display: block; font-size: 11px; font-weight: 700; margin-bottom: 1px; }
.fr-tag img { height: 10px; width: auto; vertical-align: middle; margin-right: 4px; }
.fr-tag span { display: block; opacity: 0.8; }

.fr-home { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; position: absolute; transform: translate(-50%,-50%); box-shadow: 0 0 10px var(--accent); }

/* ... [REST OF YOUR TABLE/LIST STYLES] ... */
.table-wrap{width:100%; overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); background:var(--card);}
table{width:100%; border-collapse:collapse; font-size:.72rem;}
th{background:var(--surface); color:var(--muted); padding:9px; font-family:var(--mono);}
td{padding:9px; text-align:center; border-bottom:1px solid var(--border);}
.logo{height:14px; vertical-align:middle; margin-right:4px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-title">AIX SEC OPS <span style="color:var(--accent2)">COCHIN</span></span>
  </div>
  <div class="topbar-actions">
    <div id="sTxt" style="font-size:0.7rem; font-family:var(--mono); color:var(--green)">● RADAR ACTIVE</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="flights">Arrivals & Departures</button>
  <button class="tab" data-tab="turnaround">Turnaround</button>
  <button class="tab" data-tab="radar">Radar View</button>
</div>

<div class="section active" id="flights">
  <!-- Your existing Arrivals table -->
  <div class="table-wrap">
    <table id="tArr">
      <thead><tr><th>Flight</th><th>Reg</th><th>From</th><th>ETA</th><th>Status</th></tr></thead>
      <tbody id="bArr"></tbody>
    </table>
  </div>
</div>

<div class="section" id="turnaround">
  <div class="table-wrap">
    <table id="tTurn">
      <thead><tr><th>Pair</th><th>Reg</th><th>ETA / ETD</th><th>Status</th></tr></thead>
      <tbody id="bTurn"></tbody>
    </table>
  </div>
</div>

<div class="section" id="radar">
  <div id="mapWrap">
    <div id="map"></div>
  </div>
</div>

<script>
/* ============================================================
   RADAR ENGINE
============================================================ */
const COK_COORDS = { lat: 10.1520, lng: 76.3920 };
const AIRPORT_DB = {
    'DXB': { lat: 25.2532, lng: 55.3657 }, 'SHJ': { lat: 25.3286, lng: 55.5172 },
    'AUH': { lat: 24.4330, lng: 54.6511 }, 'DOH': { lat: 25.2731, lng: 51.6081 },
    'MCT': { lat: 23.5933, lng: 58.2844 }, 'SIN': { lat: 1.3502, lng: 103.9945 },
    'KUL': { lat: 2.7456, lng: 101.7072 }, 'BKK': { lat: 13.6895, lng: 100.7501 },
    'CMB': { lat: 7.1808, lng: 79.8841 }, 'BLR': { lat: 13.1986, lng: 77.7066 }
};

let gMap, gInfoWindow;
let mapMarkers = new Map();
let mapInitialized = false;

// Custom Overlay for HTML Tag
function FlightOverlay(pos, html, map) {
    this.pos = pos;
    this.html = html;
    this.setMap(map);
}
FlightOverlay.prototype = Object.create(google.maps.OverlayView.prototype);
FlightOverlay.prototype.onAdd = function() {
    this.div = document.createElement('div');
    this.div.className = 'fr-marker';
    this.div.innerHTML = this.html;
    this.getPanes().overlayMouseTarget.appendChild(this.div);
};
FlightOverlay.prototype.draw = function() {
    const proj = this.getProjection();
    const pixel = proj.fromLatLngToDivPixel(this.pos);
    if (pixel && this.div) {
        this.div.style.left = pixel.x + 'px';
        this.div.style.top = pixel.y + 'px';
    }
};
FlightOverlay.prototype.onRemove = function() { if(this.div) this.div.remove(); };
FlightOverlay.prototype.update = function(pos, html) {
    this.pos = pos;
    if(this.div) this.div.innerHTML = html;
    this.draw();
};

function initRadar() {
    gMap = new google.maps.Map(document.getElementById("map"), {
        center: COK_COORDS, zoom: 6, disableDefaultUI: true,
        styles: [{ "featureType": "poi", "stylers": [{ "visibility": "off" }] }]
    });
    gInfoWindow = new google.maps.InfoWindow();
    mapInitialized = true;
    
    // Static COK Home
    new FlightOverlay(new google.maps.LatLng(COK_COORDS.lat, COK_COORDS.lng), '<div class="fr-home"></div>', gMap);
}

function updateRadar(flights) {
    if(!mapInitialized) return;
    const now = Math.floor(Date.now() / 1000);
    const seenIds = new Set();

    flights.forEach(f => {
        const fl = f.flight;
        const fn = fl?.identification?.number?.default;
        if(!fn) return;

        const origin = fl.airport.origin?.code?.iata;
        const sch = fl.time.scheduled.arrival;
        const est = fl.time.estimated.arrival || sch;
        const fid = fl.identification.id;

        // Interpolate: Assume 3 hour flight duration for simulated movement
        const window = 10800; 
        const progress = Math.max(0, Math.min(1, (now - (est - window)) / window));
        
        if (est > now && est < now + 14400) { // Only show in-air
            seenIds.add(fid);
            const start = AIRPORT_DB[origin] || { lat: 20, lng: 70 };
            const curPos = new google.maps.LatLng(
                start.lat + (COK_COORDS.lat - start.lat) * progress,
                start.lng + (COK_COORDS.lng - start.lng) * progress
            );

            const logo = `https://logo.clearbit.com/${fn.startsWith('IX')?'airindiaexpress.com':'airasia.com'}`;
            const html = `
                <div class="fr-plane-icon"><svg viewBox="0 0 24 24" fill="#000"><path d="M21,16v-2l-8-5V3.5c0-0.8-0.7-1.5-1.5-1.5S10,2.7,10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/></svg></div>
                <div class="fr-tag">
                    <b><img src="${logo}" onerror="this.style.display='none'">${fn}</b>
                    <span>${fl.aircraft?.registration || 'N/A'}</span>
                    <span>${origin} - COK</span>
                </div>`;

            if(mapMarkers.has(fid)) {
                mapMarkers.get(fid).update(curPos, html);
            } else {
                mapMarkers.set(fid, new FlightOverlay(curPos, html, gMap));
            }
        }
    });

    // Cleanup landed flights
    mapMarkers.forEach((m, id) => { if(!seenIds.has(id)) { m.setMap(null); mapMarkers.delete(id); }});
}

/* ============================================================
   EXISTING WORKING LOGIC (Hooks into Radar)
============================================================ */
async function loadAll() {
    const url = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.flightradar24.com/common/v1/airport.json?code=cok&plugin-setting[schedule][mode]=arrivals&limit=50')}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        const arrivals = data?.result?.response?.airport?.pluginData?.schedule?.arrivals?.data || [];
        
        // Update Table
        const tbody = document.getElementById('bArr');
        tbody.innerHTML = '';
        arrivals.forEach(f => {
            const fl = f.flight;
            const fn = fl?.identification?.number?.default;
            if(!fn) return;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${fn}</b></td><td>${fl.aircraft?.registration || '-'}</td><td>${fl.airport.origin?.code?.iata}</td><td>${new Date(fl.time.scheduled.arrival*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${fl.status.text}</td>`;
            tbody.appendChild(tr);
        });

        // Update Radar
        updateRadar(arrivals);
    } catch(e) { console.error("Data load failed", e); }
}

// Tab Switching
document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
        document.querySelectorAll('.tab, .section').forEach(el => el.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.tab).classList.add('active');
        
        if (t.dataset.tab === 'radar') {
            if (!mapInitialized) {
                const s = document.createElement('script');
                s.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initRadar`;
                document.head.appendChild(s);
            } else {
                google.maps.event.trigger(gMap, "resize");
                gMap.setCenter(COK_COORDS);
            }
        }
    };
});

window.onload = () => { loadAll(); setInterval(loadAll, 30000); };
</script>
</body>
</html>
